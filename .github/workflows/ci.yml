name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hard zero-cost guard: do not consume/bill private-repo hosted-runner minutes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
