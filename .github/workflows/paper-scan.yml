name: Saudi Paper Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Multiple staggered post-close windows. Avoid :00/:30 congestion peaks.
    # Saudi market closes 15:00 Asia/Riyadh (12:00 UTC).
    - cron: "17 12 * * 0-4"
    - cron: "47 12 * * 0-4"
    - cron: "17 13 * * 0-4"
    - cron: "47 13 * * 0-4"

permissions:
  contents: read

# Do not cancel a healthy run just because a recovery window starts.
concurrency:
  group: saudi-paper-scan-v4
  cancel-in-progress: false

jobs:
  scan:
    # Hard zero-cost guard: GitHub-hosted scheduling is allowed only on public repos.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore free persistent bot cache/state
        uses: actions/cache@v4
        with:
          path: |
            data/market_cache
            data/disclosures_cache.json
            data/sharia_allowlist.csv
            data/universe.csv
            artifacts/paper_portfolio.json
            artifacts/explorer_portfolio.json
            artifacts/alert_state.json
          key: saudi-paper-v4-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            saudi-paper-v4-${{ runner.os }}-
            saudi-paper-v3-${{ runner.os }}-
      - run: pip install -e .
      - name: Refresh free Sharia allowlist (best effort)
        run: saudi-bot sync-sharia --best-effort
      - name: Run paper scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: paper
          ZERO_PAID_SERVICES: "true"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            saudi-bot scan --send
          else
            echo "Telegram secrets are not configured; running paper scan without sending alerts."
            saudi-bot scan
          fi
