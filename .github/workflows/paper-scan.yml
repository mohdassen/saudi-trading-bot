name: Saudi Paper Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 09:27 Riyadh: capture morning earnings announcements before they rotate
    # out of the market-announcement discovery list.
    - cron: "27 6 * * 0-4"
    # Post-close recovery windows. GitHub cron is best-effort, hence redundancy.
    - cron: "17 12 * * 0-4"
    - cron: "47 12 * * 0-4"
    - cron: "17 13 * * 0-4"
    - cron: "47 13 * * 0-4"

permissions:
  contents: read

concurrency:
  group: saudi-paper-scan-v8
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore free persistent bot cache/state
        uses: actions/cache@v4
        with:
          path: |
            data/market_cache_adjusted_v1
            data/disclosures_cache.json
            data/edge_announcements_cache.json
            data/earnings_cache.json
            data/pead_official_events.json
            data/pead_verified_events.json
            data/sharia_allowlist.csv
            data/universe.csv
            artifacts/paper_portfolio.json
            artifacts/explorer_portfolio.json
            artifacts/pead_shadow_portfolio.json
            artifacts/momentum_shadow_portfolio.json
            artifacts/edge_lab_progress.json
            artifacts/pead_source_health.json
            artifacts/forward_summary.json
            artifacts/alert_state.json
          key: saudi-paper-v8-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            saudi-paper-v8-${{ runner.os }}-
            saudi-paper-v7-${{ runner.os }}-
            saudi-paper-v6-${{ runner.os }}-
            saudi-paper-v5-${{ runner.os }}-
      - run: pip install -e .
      - name: Refresh free Sharia allowlist (best effort)
        run: saudi-bot sync-sharia --best-effort
      - name: Run production-gated Paper scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: paper
          ZERO_PAID_SERVICES: "true"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            saudi-bot scan --send
          else
            echo "Telegram secrets are not configured; running paper scan without sending alerts."
            saudi-bot scan
          fi
      - name: Run Saudi Edge Lab V2 shadows
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: python -m saudi_trading_bot.edge_lab
      - name: Verify PEAD events from announcement detail pages
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: python -m saudi_trading_bot.pead_verified_rescue
      - name: Emit auditable forward shadow summary
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: |
          python -m saudi_trading_bot.forward_summary | tee /tmp/forward-summary.txt
          {
            echo "### Saudi Forward Shadow"
            echo '```text'
            cat /tmp/forward-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-forward-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/forward_summary.json
            artifacts/pead_source_health.json
            artifacts/pead_shadow_portfolio.json
            artifacts/momentum_shadow_portfolio.json
            data/pead_verified_events.json
