name: Saudi Paper Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * 0-4"
    - cron: "17 12 * * 0-4"
    - cron: "47 12 * * 0-4"
    - cron: "17 13 * * 0-4"
    - cron: "47 13 * * 0-4"

permissions:
  contents: write

concurrency:
  group: saudi-paper-scan-v9
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore free performance cache
        uses: actions/cache@v4
        with:
          path: |
            data/market_cache_adjusted_v1
            data/disclosures_cache.json
            data/edge_announcements_cache.json
            data/earnings_cache.json
            data/pead_official_events.json
            data/pead_verified_events.json
            data/sharia_allowlist.csv
            data/universe.csv
          key: saudi-paper-v9-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            saudi-paper-v9-${{ runner.os }}-
            saudi-paper-v8-${{ runner.os }}-
      - run: pip install -e .
      - name: Restore durable forward evidence
        run: |
          mkdir -p artifacts
          git fetch origin bot-state:refs/remotes/origin/bot-state || true
          if git show origin/bot-state:artifacts/durable_state_snapshot.json > artifacts/durable_state_snapshot.json 2>/dev/null; then
            python -m saudi_trading_bot.state_persistence restore
          else
            echo "No durable snapshot found yet; starting from repository/default state."
          fi
      - name: Refresh free Sharia allowlist (best effort)
        run: saudi-bot sync-sharia --best-effort
      - name: Run production-gated Paper scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MODE: paper
          ZERO_PAID_SERVICES: "true"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            saudi-bot scan --send
          else
            echo "Telegram secrets are not configured; running paper scan without sending alerts."
            saudi-bot scan
          fi
      - name: Run Saudi Edge Lab V2 shadows
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: python -m saudi_trading_bot.edge_lab
      - name: Verify PEAD events from announcement detail pages
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: python -m saudi_trading_bot.pead_verified_rescue
      - name: Emit auditable forward shadow summary
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: |
          python -m saudi_trading_bot.forward_summary | tee /tmp/forward-summary.txt
          {
            echo "### Saudi Forward Shadow"
            echo '```text'
            cat /tmp/forward-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build decision intelligence scoreboard
        env:
          BOT_MODE: shadow
          ZERO_PAID_SERVICES: "true"
        run: |
          python -m saudi_trading_bot.decision_intelligence | tee /tmp/decision-intelligence.txt
          {
            echo "### Decision Intelligence"
            echo '```text'
            cat /tmp/decision-intelligence.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist durable forward evidence
        if: success()
        run: |
          python -m saudi_trading_bot.state_persistence snapshot
          git config user.name "saudi-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin bot-state:refs/remotes/origin/bot-state || true
          rm -rf /tmp/saudi-bot-state
          git worktree add /tmp/saudi-bot-state origin/bot-state
          mkdir -p /tmp/saudi-bot-state/artifacts
          cp artifacts/durable_state_snapshot.json /tmp/saudi-bot-state/artifacts/durable_state_snapshot.json
          git -C /tmp/saudi-bot-state add -f artifacts/durable_state_snapshot.json
          git -C /tmp/saudi-bot-state commit -m "state: persist forward evidence from run ${{ github.run_id }}" || true
          git -C /tmp/saudi-bot-state push origin HEAD:bot-state
