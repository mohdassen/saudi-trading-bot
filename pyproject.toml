[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-trading-bot"
version = "0.2.1"
description = "Saudi-only trading research bot: Sharia screening, technical signals, disclosures, backtest, paper trading, Telegram alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "yfinance>=0.2.54",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.scripts]
saudi-bot = "saudi_trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "DTZ"]
