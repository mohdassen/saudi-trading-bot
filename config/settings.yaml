market:
  timezone: Asia/Riyadh
  exchange: SAU
  trading_days: [SUN, MON, TUE, WED, THU]
  session_start: "10:00"
  session_end: "15:00"
  symbols_file: data/universe.csv

market_regime:
  method: sharia_breadth
  min_eligible_symbols: 150
  historical_min_eligible_symbols: 80
  min_history_rows: 220
  risk_on_min_pct_above_ema50: 50.0
  risk_on_min_pct_above_ema200: 45.0
  risk_on_min_median_mom20_pct: 0.0
  recovery_min_pct_above_ema50: 55.0
  recovery_min_pct_above_ema200: 30.0
  recovery_min_median_mom20_pct: 1.0
  recovery_breakout_min_strategy_score: 105.0

data:
  provider: yfinance
  free_only: true
  lookback_days: 420
  interval: 1d
  suffix: .SR
  cache_dir: data/market_cache_adjusted_v1
  price_adjustment: split_dividend_adjusted
  max_cache_age_days: 7
  min_fresh_symbols: 150
  min_session_consensus_pct: 80.0

sharia:
  mode: strict_allowlist
  allowlist_file: data/sharia_allowlist.csv
  source_url: "https://alrajhi-capital.sa/shariah-group/about-us-guidelines"
  max_source_check_age_days: 14
  block_unknown: true

disclosures:
  enabled: true
  source_url: "https://www.saudiexchange.sa/wps/portal/saudiexchange/newsandreports/issuer-news/issuer-announcements?locale=en"
  cache_file: data/disclosures_cache.json
  fallback_url: "https://english.mubasher.info/news/sa/now/announcements"
  lookback_days: 7
  timeout_seconds: 20

signals:
  active_strategy: CASH
  min_history_rows: 220
  min_price_sar: 3.0
  min_avg_value_sar_20d: 1000000
  score_threshold_watch: 62
  score_threshold_entry: 72
  entry_rules:
    rsi_min: 52
    rsi_max: 68
    momentum_20d_min_pct: 2
    momentum_20d_max_pct: 22
    volume_ratio_min: 1.05
    near_high20_ratio: 0.98
    require_ema_stack: true
  weights:
    trend: 0.35
    momentum: 0.30
    swing: 0.20
    disclosure: 0.15

risk:
  paper_equity_sar: 100000
  risk_per_trade_pct: 0.75
  max_position_pct: 12.5
  max_open_positions: 5
  atr_stop_multiple: 1.8
  reward_risk: 2.2
  max_daily_new_positions: 2
  no_trade_if_market_breadth_weak: true

paper:
  portfolio_file: artifacts/paper_portfolio.json
  slippage_bps: 10
  commission_bps: 15.5
  min_hold_days: 2
  max_hold_days: 25

explorer:
  enabled: true
  portfolio_file: artifacts/explorer_portfolio.json
  risk_per_trade_pct: 0.25
  max_position_pct: 5.0
  max_open_positions: 3
  max_daily_new_positions: 1
  min_signal_score: 78
  reward_risk: 1.8
  max_hold_days: 10
  performance_window: 10
  min_trades_before_brake: 10
  min_profit_factor: 0.80
  max_loss_pct: 2.0

edge_lab:
  enabled: true
  target_closed_trades: 30
  progress_file: artifacts/edge_lab_progress.json
  announcements_cache_file: data/edge_announcements_cache.json
  earnings_cache_file: data/earnings_cache.json
  official_home_fallback_url: "https://www.saudiexchange.sa/wps/portal/saudiexchange/home?locale=en"
  qualification:
    min_expectancy_r: 0.10
    min_profit_factor: 1.30
    max_drawdown_r: 6.0
  pead:
    portfolio_file: artifacts/pead_shadow_portfolio.json
    risk_per_trade_pct: 0.25
    max_position_pct: 5.0
    max_open_positions: 5
    max_daily_new_positions: 1
    reward_risk: 2.0
    atr_stop_multiple: 2.0
    max_hold_days: 20
    announcement_lookback_days: 12
    min_sessions_after_announcement: 1
    max_sessions_after_announcement: 5
    min_earnings_score: 70
    min_technical_score: 60
    min_avg_value_sar_20d: 1000000
    min_post_event_return_pct: -2.0
    max_post_event_return_pct: 15.0
  momentum:
    portfolio_file: artifacts/momentum_shadow_portfolio.json
    risk_per_trade_pct: 0.25
    max_position_pct: 5.0
    max_open_positions: 5
    max_daily_new_positions: 1
    reward_risk: 2.0
    atr_stop_multiple: 2.0
    max_hold_days: 25
    min_cross_section_percentile: 0.75
    min_mom6_1_pct: 8.0
    min_mom3_1_pct: 3.0
    min_52w_high_proximity: 0.85
    recent20_min_pct: -5.0
    recent20_max_pct: 15.0
    max_atr_pct: 6.0
    min_avg_value_sar_20d: 1000000

notifications:
  telegram_enabled: true
  send_watchlist_digest: true
  send_only_state_changes: true
  state_file: artifacts/alert_state.json

validation:
  engine: nested_strategy_lab_v3_1
  years: 10
  min_oos_trades: 120
  min_win_rate_pct: 38.0
  min_profit_factor: 1.20
  max_drawdown_pct: 15.0
  min_profitable_folds: 5
  strategy_lab:
    training_years: 2
    oos_years: 8
    min_train_trades: 12
    min_train_profit_factor: 1.05
